<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="dsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
  </defs>

  <!-- Tree Structure (Top) -->
  <!-- Root Node -->
  <rect x="23" y="4" width="18" height="9" rx="2.5" stroke="url(#dsaGrad)" stroke-width="2.6" fill="none"/>
  
  <!-- Main Stem & Branches -->
  <path d="M 32 13 L 32 18 M 32 18 L 21 23 M 32 18 L 43 23" 
        stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Internal Node -->
  <circle cx="21" cy="24" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.5" fill="none"/>
  <!-- Sub-branches Left -->
  <path d="M 18.5 26.5 L 12.5 32 M 23.5 26.5 L 26.5 32" 
        stroke="url(#dsaGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Internal Node -->
  <circle cx="43" cy="24" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.5" fill="none"/>
  <!-- Sub-branches Right -->
  <path d="M 40.5 26.5 L 37.5 32 M 45.5 26.5 L 51.5 32" 
        stroke="url(#dsaGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 4 Leaf Nodes -->
  <rect x="7" y="32" width="11" height="6.5" rx="2" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="21" y="32" width="11" height="6.5" rx="2" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="33" y="32" width="11" height="6.5" rx="2" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="47" y="32" width="11" height="6.5" rx="2" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>

  <!-- Bottom-Left: Stack / Data Array (3 Layers) -->
  <!-- Layer 1 -->
  <rect x="7" y="42" width="22" height="6.5" rx="2.5" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="11.5" y="44" width="8" height="2.5" rx="1.2" stroke="url(#dsaGrad)" stroke-width="1.6" fill="none"/>

  <!-- Layer 2 -->
  <rect x="7" y="50" width="22" height="6.5" rx="2.5" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="11.5" y="52" width="8" height="2.5" rx="1.2" stroke="url(#dsaGrad)" stroke-width="1.6" fill="none"/>

  <!-- Layer 3 -->
  <rect x="7" y="58" width="22" height="6.5" rx="2.5" stroke="url(#dsaGrad)" stroke-width="2.2" fill="none"/>
  <rect x="11.5" y="60" width="8" height="2.5" rx="1.2" stroke="url(#dsaGrad)" stroke-width="1.6" fill="none"/>

  <!-- Bottom-Right: Graph / Network Structure -->
  <!-- Edges -->
  <line x1="50" y1="43" x2="57" y2="51" stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="50" y1="43" x2="42" y2="52" stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="57" y1="51" x2="54" y2="60" stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="54" y2="60" stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="33" y2="60" stroke="url(#dsaGrad)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Circular Graph Nodes -->
  <circle cx="50" cy="43" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.4" fill="none"/>
  <circle cx="57" cy="51" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.4" fill="none"/>
  <circle cx="42" cy="52" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.4" fill="none"/>
  <circle cx="54" cy="60" r="3.6" stroke="url(#dsaGrad)" stroke-width="2.4" fill="none"/>
  <circle cx="33" cy="60" r="3.4" stroke="url(#dsaGrad)" stroke-width="2.4" fill="none"/>
</svg>
