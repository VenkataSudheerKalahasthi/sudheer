<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
  </defs>

  <!-- Laptop Screen Outer Frame -->
  <path d="M 9 48 L 9 14 C 9 10.7 11.7 8 15 8 L 49 8 C 52.3 8 55 10.7 55 14 L 55 24" 
        stroke="url(#javaGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Window Titlebar Separator -->
  <line x1="9" y1="17" x2="55" y2="17" stroke="url(#javaGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Window 3 Control Dots -->
  <circle cx="14" cy="12.5" r="1.5" fill="url(#javaGrad)"/>
  <circle cx="18.5" cy="12.5" r="1.5" fill="url(#javaGrad)"/>
  <circle cx="23" cy="12.5" r="1.5" fill="url(#javaGrad)"/>

  <!-- Java Coffee Cup Steam -->
  <path d="M 23 29 C 20.5 25.5 23.5 22 21.5 18 C 20.5 16.5 21.5 15 23 14" 
        stroke="url(#javaGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 27 28 C 29.5 24 27 20.5 29 17 C 30 15 29 13.5 28 12" 
        stroke="url(#javaGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Java Coffee Cup Body & Handle -->
  <path d="M 17 33 C 18 36.5 29 36.5 30 33" stroke="url(#javaGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Handle -->
  <path d="M 29.5 32.5 C 33.5 32.5 34.5 37 29.5 38.5" stroke="url(#javaGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Cup lower body -->
  <path d="M 18.5 37.5 C 19.5 41 28 41 29 37.5" stroke="url(#javaGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Saucer -->
  <ellipse cx="23.5" cy="43.5" rx="8.5" ry="2.2" stroke="url(#javaGrad)" stroke-width="2.2" fill="none"/>

  <!-- Code Symbol </> -->
  <path d="M 39 25 L 35 29 L 39 33" stroke="url(#javaGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 44.5 23.5 L 41 34.5" stroke="url(#javaGrad)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 45 25 L 49 29 L 45 33" stroke="url(#javaGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="55" y1="24.5" x2="55" y2="33.5" stroke="url(#javaGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Database Stack (Cylinder) -->
  <!-- Top disk -->
  <ellipse cx="50" cy="38" rx="6.5" ry="2.4" stroke="url(#javaGrad)" stroke-width="2.5" fill="none"/>
  <!-- Middle disk -->
  <path d="M 43.5 38 L 43.5 43.5 C 43.5 45.5 46.5 46.8 50 46.8 C 53.5 46.8 56.5 45.5 56.5 43.5 L 56.5 38" 
        stroke="url(#javaGrad)" stroke-width="2.5" fill="none"/>
  <!-- Bottom disk 1 -->
  <path d="M 43.5 43.5 L 43.5 49 C 43.5 51 46.5 52.3 50 52.3 C 53.5 52.3 56.5 51 56.5 49 L 56.5 43.5" 
        stroke="url(#javaGrad)" stroke-width="2.5" fill="none"/>
  <!-- Bottom disk 2 -->
  <path d="M 43.5 49 L 43.5 54.5 C 43.5 56.5 46.5 57.8 50 57.8 C 53.5 57.8 56.5 56.5 56.5 54.5 L 56.5 49" 
        stroke="url(#javaGrad)" stroke-width="2.5" fill="none"/>

  <!-- Cog / Gear next to database -->
  <g transform="translate(37, 49.5)">
    <!-- 8 Gear teeth -->
    <path d="M -1 -7.2 L 1 -7.2 L 1.5 -5.8 L 3.5 -5 L 4.8 -6 L 6 -4.8 L 5 -3.5 L 5.8 -1.5 L 7.2 -1 L 7.2 1 L 5.8 1.5 L 5 3.5 L 6 4.8 L 4.8 6 L 3.5 5 L 1.5 5.8 L 1 7.2 L -1 7.2 L -1.5 5.8 L -3.5 5 L -4.8 6 L -6 4.8 L -5 3.5 L -5.8 1.5 L -7.2 1 L -7.2 -1 L -5.8 -1.5 L -5 -3.5 L -6 -4.8 L -4.8 -6 L -3.5 -5 L -1.5 -5.8 Z" 
          stroke="url(#javaGrad)" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    <circle cx="0" cy="0" r="2.4" stroke="url(#javaGrad)" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Laptop Base (Stand) -->
  <path d="M 33 48 L 10 48 C 6.5 48 4 50.5 4 53.5 C 4 56.5 6.5 58 10 58 L 34 58" 
        stroke="url(#javaGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
