<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
  </defs>

  <!-- Mechanical Gear / Cog (Top Right) -->
  <g transform="translate(48, 15)">
    <!-- 8 teeth gear -->
    <path d="M -2.2 -10.5 L 2.2 -10.5 L 2.8 -8.5 L 5.5 -7.4 L 7.5 -8.8 L 9.8 -6.5 L 8.4 -4.5 L 9.5 -1.8 L 11.5 -1.2 L 11.5 3.2 L 9.5 3.8 L 8.4 6.5 L 9.8 8.5 L 7.5 10.8 L 5.5 9.4 L 2.8 10.5 L 2.2 12.5 L -2.2 12.5 L -2.8 10.5 L -5.5 9.4 L -7.5 10.8 L -9.8 8.5 L -8.4 6.5 L -9.5 3.8 L -11.5 3.2 L -11.5 -1.2 L -9.5 -1.8 L -8.4 -4.5 L -7.5 -8.8 L -5.5 -7.4 L -2.8 -8.5 Z" 
          stroke="url(#projGrad)" stroke-width="2.2" stroke-linejoin="round" fill="#1e1e1f"/>
    <!-- Gear center hole -->
    <circle cx="0" cy="1" r="4.2" stroke="url(#projGrad)" stroke-width="2.2" fill="none"/>
  </g>

  <!-- Laptop Screen Outer Frame -->
  <path d="M 10 49 L 10 14 C 10 10.7 12.7 8 16 8 L 38 8" 
        stroke="url(#projGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Window Titlebar Separator -->
  <line x1="10" y1="18" x2="38" y2="18" stroke="url(#projGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Window 3 Control Dots -->
  <circle cx="15" cy="13" r="1.5" fill="url(#projGrad)"/>
  <circle cx="19.5" cy="13" r="1.5" fill="url(#projGrad)"/>
  <circle cx="24" cy="13" r="1.5" fill="url(#projGrad)"/>

  <!-- Code Bracket </> on Left -->
  <path d="M 21 26 L 15 31 L 21 36" stroke="url(#projGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 26.5 24.5 L 22 37.5" stroke="url(#projGrad)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 26.5 26 L 32.5 31 L 26.5 36" stroke="url(#projGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horizontal Code Lines -->
  <line x1="13" y1="42" x2="32" y2="42" stroke="url(#projGrad)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="13" y1="46" x2="25" y2="46" stroke="url(#projGrad)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Laptop Base (Stand) -->
  <path d="M 5 53 C 5 50.5 7.5 49 10.5 49 L 34 49" stroke="url(#projGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 5 53 C 5 55.5 7.5 58 10.5 58 L 54.5 58 C 57.5 58 60 55.5 60 53 C 60 50.5 57.5 49 55.5 49" 
        stroke="url(#projGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Project Checklist Document / Clipboard (Bottom Right) -->
  <!-- Clipboard Body -->
  <rect x="35" y="28" width="21" height="29" rx="3.5" stroke="url(#projGrad)" stroke-width="2.6" fill="#1e1e1f"/>
  
  <!-- Clipboard Top Clip -->
  <path d="M 42 28 L 42 26 C 42 24.8 43 24 44.2 24 L 46.8 24 C 48 24 49 24.8 49 26 L 49 28" 
        stroke="url(#projGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="#1e1e1f"/>

  <!-- Checklist Item 1 -->
  <rect x="38" y="32.5" width="5.5" height="5.5" rx="1.2" stroke="url(#projGrad)" stroke-width="1.8" fill="none"/>
  <path d="M 39.5 35.2 L 41 36.8 L 44.5 33.5" stroke="url(#projGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="47" y1="35.5" x2="53" y2="35.5" stroke="url(#projGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Checklist Item 2 -->
  <rect x="38" y="40.5" width="5.5" height="5.5" rx="1.2" stroke="url(#projGrad)" stroke-width="1.8" fill="none"/>
  <path d="M 39.5 43.2 L 41 44.8 L 44.5 41.5" stroke="url(#projGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="47" y1="43.5" x2="53" y2="43.5" stroke="url(#projGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Checklist Item 3 -->
  <rect x="38" y="48.5" width="5.5" height="5.5" rx="1.2" stroke="url(#projGrad)" stroke-width="1.8" fill="none"/>
  <path d="M 39.5 51.2 L 41 52.8 L 44.5 49.5" stroke="url(#projGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="47" y1="51.5" x2="53" y2="51.5" stroke="url(#projGrad)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
